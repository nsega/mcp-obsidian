# golangci-lint configuration
# See https://golangci-lint.run/usage/configuration/

run:
  # Timeout for analysis
  timeout: 5m

  # Include test files
  tests: true

  # Which dirs to skip
  skip-dirs:
    - vendor
    - build
    - coverage

# Output configuration
output:
  # Colored output
  colored-line-number: true

  # Print lines of code with issue
  print-issued-lines: true

  # Print linter name in the end of issue text
  print-linter-name: true

# Linters settings
linters:
  # Disable all linters
  disable-all: true

  # Enable specific linters
  enable:
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Static analysis
    - unused        # Check for unused constants, variables, functions and types
    - gofmt         # Check code is formatted
    - goimports     # Check imports are formatted
    - misspell      # Check for misspelled English words
    - revive        # Fast, configurable, extensible, flexible linter
    - gosec         # Inspects source code for security problems
    - unconvert     # Remove unnecessary type conversions
    - goconst       # Find repeated strings that could be constants
    - gocyclo       # Computes cyclomatic complexity
    - dupl          # Code clone detection
    - prealloc      # Find slice declarations that could be preallocated
    - exportloopref # Check for pointers to enclosing loop variables

# Linters settings
linters-settings:
  errcheck:
    # Report about not checking of errors in type assertions
    check-type-assertions: true

    # Report about assignment of errors to blank identifier
    check-blank: true

  govet:
    # Enable all analyzers
    enable-all: true

  gocyclo:
    # Minimal cyclomatic complexity to report
    min-complexity: 15

  dupl:
    # Tokens count to trigger issue
    threshold: 100

  misspell:
    # Correct spellings using locale preferences for US or UK
    locale: US

  revive:
    # Enable all rules
    confidence: 0.8

  gosec:
    # Include test files
    tests: true

    # Select a subset of rules to run
    excludes:
      - G104 # Audit errors not checked - covered by errcheck

# Issues configuration
issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 0

  # Maximum count of issues with the same text
  max-same-issues: 0

  # Exclude some linters from running on test files
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
