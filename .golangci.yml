version: "2"

linters:
  # Default set of linters: none, standard, all, or fast
  default: none
  # Enable specific linters
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - prealloc
  # Linter-specific settings
  settings:
    govet:
      enable:
        - shadow
        - fieldalignment
    errcheck:
      check-blank: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
