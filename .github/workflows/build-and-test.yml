name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # staticcheck must be pinned rather than @latest: setup-go v6+ exports
  # GOTOOLCHAIN=local, so an upstream go directive above ours would fail the build.
  # Its floor is tied to the go directive in go.mod - bump both together.
  STATICCHECK_VERSION: v0.8.1

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    # go-version-file keeps the toolchain tied to go.mod. setup-go v6+ exports
    # GOTOOLCHAIN=local, so a hard-coded version here would have to be bumped in
    # lockstep with go.mod or the build fails. Module and build caches come from
    # setup-go's own cache (on by default) - a second actions/cache step over the
    # same paths collides with it on restore.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

    # `go fix -diff` exits 1 when it has a diff to report, and the default shell
    # is `bash -e`, so the assignment needs `|| true` or the step dies before it
    # can print the diff and the annotation.
    - name: Check go fix modernizers
      run: |
        diff=$(go fix -diff ./... 2>&1) || true
        if [ -n "$diff" ]; then
          echo "$diff"
          echo "::error::go fix found unmodernized code. Run 'go fix ./...' and commit the changes."
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
        staticcheck ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # The Makefile owns this pin so `make lint` and CI cannot drift apart.
    # golangci-lint refuses to load a module whose Go version is newer than the one
    # it was built with, so its floor is tied to the go directive in go.mod.
    - name: Resolve pinned golangci-lint version
      id: tools
      run: echo "golangci_lint=v$(make -s print-golangci-lint-version)" >> "$GITHUB_OUTPUT"

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: ${{ steps.tools.outputs.golangci_lint }}
        args: --timeout=5m
