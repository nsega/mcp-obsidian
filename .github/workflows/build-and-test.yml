name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Keep this in sync with the version pinned in the Makefile.
env:
  GOLANGCI_LINT_VERSION: v2.13.2
  STATICCHECK_VERSION: v0.8.1

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    # go-version-file keeps the toolchain tied to go.mod. setup-go v6+ exports
    # GOTOOLCHAIN=local, so a hard-coded version here would have to be bumped in
    # lockstep with go.mod or the build fails.
    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

    - name: Check go fix modernizers
      run: |
        diff=$(go fix -diff ./... 2>&1)
        if [ -n "$diff" ]; then
          echo "$diff"
          echo "::error::go fix found unmodernized code. Run 'go fix ./...' and commit the changes."
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
        staticcheck ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # golangci-lint refuses to load a module whose Go version is newer than the
    # one it was built with, so this pin has a floor set by go.mod.
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: ${{ env.GOLANGCI_LINT_VERSION }}
        args: --timeout=5m
